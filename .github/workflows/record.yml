# Every night: read WikiWatch's public record and commit what changed. Reads only what anyone
# can read; it needs no Ilisium key, and writes only to this repository.
name: record

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read WikiWatch's public record
        run: node scripts/wiki-export.mjs --api https://ilisium.xyz --out .
      - name: Commit what changed
        run: |
          git add -A index.json articles
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          count() { git diff --cached --name-status -- "articles/*/$1" | grep -c "$2" || true; }
          added=$(count article.json '^A')
          differences=$(count differences.json .)
          trust=$(count trust.json .)
          facts=$(count facts.json .)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "The record on $(date -u +%F)" \
            -m "Articles added: $added. Articles whose differences changed: $differences. Trust changed: $trust. Facts changed: $facts."
          git push
